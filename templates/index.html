<!DOCTYPE html>
<html>
<head>
    <title>Crop Recommendation</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #d4fc79, #96e6a1);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #2d6a4f;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 280px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2d6a4f;
            box-shadow: 0 0 5px #2d6a4f;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 8px;
            background: #2d6a4f;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #40916c;
        }

        h3 {
            margin-top: 15px;
            color: #1b4332;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🌱 Crop Recommendation System</h2>

    <div class="card">
        <form action="/predict" method="post">
            <input type="number" name="N" placeholder="Nitrogen" required>
            <input type="number" name="P" placeholder="Phosphorus" required>
            <input type="number" name="K" placeholder="Potassium" required>
            <input type="number" name="temperature" placeholder="Temperature" required>
            <input type="number" name="humidity" placeholder="Humidity" required>
            <input type="number" name="ph" placeholder="pH value" required>
            <input type="number" name="rainfall" placeholder="Rainfall" required>

            <button type="submit">Predict Crop</button>
        </form>
        <h3>Top Crops:</h3>
<h3>🌾 Best Crop: {{ prediction }}</h3>
        <h3>{{ prediction }}</h3>
    </div>
</div>

</body>
</html>
