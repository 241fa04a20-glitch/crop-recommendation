<!DOCTYPE html>
<html>
<head>
    <title>Crop Recommendation</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #d4fc79, #96e6a1);
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            width: 300px;
            margin: auto;
            margin-top: 50px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        h3 {
            color: green;
        }
    </style>
</head>

<body>

<h1>🌱 Crop Recommendation System</h1>

<div class="container">
<form action="/predict" method="post">
    <input type="number" name="N" placeholder="Nitrogen" required>
    <input type="number" name="P" placeholder="Phosphorus" required>
    <input type="number" name="K" placeholder="Potassium" required>
    <input type="number" name="temperature" placeholder="Temperature" required>
    <input type="number" name="humidity" placeholder="Humidity" required>
    <input type="number" name="ph" placeholder="pH value" required>
    <input type="number" name="rainfall" placeholder="Rainfall" required>

    <button type="submit">Predict Crop</button>
</form>
<button onclick="getWeather()">Auto Fill Weather</button>

<script>
function getWeather() {
    navigator.geolocation.getCurrentPosition(function(pos) {
        let lat = pos.coords.latitude;
        let lon = pos.coords.longitude;

        fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=YOUR_API_KEY&units=metric`)
        .then(res => res.json())
        .then(data => {
            document.getElementsByName("temperature")[0].value = data.main.temp;
            document.getElementsByName("humidity")[0].value = data.main.humidity;
        });
    });
}
</script>
<h3>{{ prediction }}</h3>
</div>

</body>
</html>
